; 단독 실행용 FTP 프록시(ftp_handler.proxy.flask_proxy)를 위한 uWSGI 설정.
;
; 실행:  uwsgi --ini wsgi.ini   (사내 클라우드에서는 wsgi.ini가 자동으로 사용됨)
; 프록시를 단독으로 서비스한다. 기존 앱에 붙이려면 attach_to_running_app.py를
; 참고하라(그 경우 이 파일은 쓰이지 않는다).
;
; 여기 값들은 이 워크로드에 맞춰 조정했다: 신뢰하는 단일 사용자, 적지만 오래
; 걸리는 요청들이며, 각 요청은 내부적으로 자체 스레드 풀을 펼쳐 FTP 플릿에 접속하고
; 파일 바이트를 메모리에 들고 있는다. ADR 0001 참고.

[uwsgi]
; ── 진입점 ───────────────────────────────────────────────────────────────────
; 앱 팩토리를 직접 호출한다 — 끝의 ()가 uWSGI로 하여금 create_app()을 실행해
; 그 반환값을 서비스하게 하므로, 별도의 wsgi.py 껍데기가 필요 없다.
module = ftp_handler.proxy.flask_proxy:create_app()
; 1차 패키지들을 import 가능하게 만든다. 프록시 호스트에서 레포가 체크아웃된 위치
; (ftp_handler/ 를 담고 있는 디렉터리)를 가리키게 하라.
pythonpath = /opt/flask_modules

; ── 프로세스 모델 ────────────────────────────────────────────────────────────
master = true
; 각 요청은 I/O 바운드이고 플릿용 ThreadPoolExecutor를 스스로 돌리므로, 실제 동시성은
; 요청 '내부'에 있다. 사용자 한 명에게는 프로세스 두어 개면 충분하고, 긴 /download가
; 워커를 점유하는 동안 스레드가 /healthz·/list 응답성을 유지해준다.
processes = 2
threads = 4
enable-threads = true
single-interpreter = true

; ── 타임아웃 (ADR 0001) ──────────────────────────────────────────────────────
; 다운로더의 호스트별 백스톱 기본값은 host_timeout=45초이며, uWSGI가 요청을 죽이기
; '전에' 발동하도록 설계됐다. 그래야 워커가 도중에 강제 종료되는 대신 앱이 깔끔한
; 부분 리포트를 반환한다. harakiri는 45초보다 위로 유지하라. host_timeout을 올리면
; 이 값도 같이 올려라.
harakiri = 75
harakiri-verbose = true

; ── 요청 크기 ────────────────────────────────────────────────────────────────
; 다운로드 스펙 POST는 아주 작다. 다만 호스트 목록이 길어도 기본 4k 한계에 걸리지
; 않도록 헤더/버퍼 여유를 넉넉히 둔다. 응답 크기(base64 파일 바이트)는 여기가 아니라
; 앱 쪽 ADR 0001의 배치 계산으로 제한된다.
buffer-size = 65535

; ── 네트워킹 ─────────────────────────────────────────────────────────────────
; 단독 실행(리버스 프록시 없음): HTTP로 직접 응답한다.
http-socket = 0.0.0.0:8080
; nginx 뒤에 둘 때는 unix 소켓을 쓰고 위의 http-socket은 주석 처리하라:
; socket = /run/ftp_proxy/uwsgi.sock
; chmod-socket = 660

; ── 수명주기 / 메모리 관리 ───────────────────────────────────────────────────
die-on-term = true
vacuum = true
; 메모리 내 다운로드는 RSS가 들쭉날쭉하므로, 워커를 재활용해 증가를 억제한다.
max-requests = 200
reload-on-rss = 1024
