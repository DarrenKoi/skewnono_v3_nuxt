[uwsgi]
; --- Application entry ---------------------------------------------------
; Root index.py exposes `application = create_app()` by importing the
; Flask factory from the `back_dev_home.app` namespace package.
chdir           = %c
module          = index
callable        = application

; --- Process model -------------------------------------------------------
master          = true
processes       = 4
; I/O-bound slots: /api/msr-image and recipe open run tool-FTP fetches INSIDE
; the request (seconds each), so slots wedge behind them and queued requests
; (assets included) die at the ingress as 502s. 4 threads/worker = 16 slots.
threads         = 4
enable-threads  = true
lazy-apps       = true

; --- Networking ----------------------------------------------------------
; Standalone HTTP (matches Phase 1/2: Flask on localhost:5000).
http-socket     = 0.0.0.0:5000

; For Phase 3 behind nginx, comment out http-socket above and use a
; unix socket or the native uwsgi protocol instead:
; socket        = /tmp/skewnono.sock
; chmod-socket  = 660
; vacuum        = true

; --- Lifecycle -----------------------------------------------------------
die-on-term     = true
need-app        = true
single-interpreter = true

; Nightly freshness. The scheduler's `uwsgi_touch_reload` job touches this file
; at 00:05 KST and the master then gracefully reloads every worker, so a day's
; work always starts on a process minutes old.
;
; The job PARSES this line to find the path (%d = this file's directory, with
; a trailing slash), so the path lives in exactly one place: change it here and
; the job follows. Remove the line and the job says so in the run log instead
; of touching a file nobody watches.
;
; The trigger need not exist beforehand — uWSGI records mtime 0 for an absent
; one, and the job creates it on its first run.
touch-reload    = %drestart.txt

; --- Logging -------------------------------------------------------------
log-date        = true
disable-logging = false
log-4xx         = true
log-5xx         = true

; --- Buffers / limits ----------------------------------------------------
buffer-size     = 32768
post-buffering  = 8192
; Must outlive every bound the app enforces itself, because a harakiri SIGKILL
; takes the whole worker — including the other threads' in-flight requests —
; where the app's own bound answers with a clean coded status:
;   FTP:  ftp_handler host_timeout 60s -> 503, image still cached (at 60 these raced)
;   Chat: nothing. Since 2026-09-01 a chat turn is answered on a background
;         worker and the POST returns 202 in milliseconds, so the RAG's
;         240-300s budget no longer sits under this number. It used to:
;         cap 360 + a 5s adapter grace made 380 the floor here.
; 720 is what the cloud host actually runs (user-confirmed 2026-09-01). This
; file is NOT deployed — the cloud keeps its own permanent copy — so the value
; here is the record of what that copy must contain, and it was 380 while the
; chat bound was still under it.
harakiri        = 720
max-requests    = 1000
