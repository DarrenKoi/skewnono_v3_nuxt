resource: recipe-tat
description: Recipe Turn-Around-Time analytics — ranks measurement recipes by total time consumption over a date window. Powers the recipe-tat dashboard for both CD-SEM and HV-SEM.
base_path: /api/cdsem/recipe-tat

types:
  RankingRow:
    rank:
      type: integer
      description: 1-based rank by total_meastime within the filtered window
    class_name:
      type: string
      examples: ["ADI", "AEI", "OVL"]
    recipe_name:
      type: string
      examples: ["ADI_LINEWIDTH_046", "ADI_PROFILE_051"]
    full_name:
      type: string
      format: "<class>/<recipe>"
    meas_counts:
      type: integer
      description: Execution count of this recipe in the window
    total_meastime:
      type: integer
      description: Sum of meastime in seconds
    avg_meastime:
      type: number
      description: total_meastime / meas_counts, rounded to 2 decimals
    sample_eqp_ids:
      type: array
      description: Up to 5 distinct equipment IDs that ran this recipe
    sample_lot_cds:
      type: array
      description: Up to 5 distinct lot codes the recipe was run against
    fab_names:
      type: array of string
      description: Fabs contributing to the aggregate, sorted ascending

  Summary:
    tool_type:
      type: string
      enum: ["cd-sem", "hv-sem"]
    fab_names:
      type: array of string
      description: Echo of the resolved fab filter, uppercased. Empty array when not filtered.
      examples: [[R3, M16B]]
    start_date:
      type: string
      format: "YYYY-MM-DD"
    end_date:
      type: string
      format: "YYYY-MM-DD"
    anchor_date:
      type: string
      format: "YYYY-MM-DD"
      description: ANCHOR_TIME.date() — the latest date the dataset covers
    total_executions:
      type: integer
    total_recipes:
      type: integer
      description: Distinct (class_name, recipe_name) pairs in the window
    total_tat_seconds:
      type: integer
    avg_meastime:
      type: number

  DailyTrendPoint:
    date:
      type: string
      format: "YYYY-MM-DD"
    total_meastime:
      type: integer
    exec_count:
      type: integer

  DeviceRow:
    lot_cd:
      type: string
    exec_count:
      type: integer
    total_meastime:
      type: integer

  EquipmentRow:
    eqp_id:
      type: string
      examples: ["ECXDX123"]
    fab_name:
      type: string
    eqp_model_cd:
      type: string
    exec_count:
      type: integer
    total_meastime:
      type: integer
    avg_meastime:
      type: number
    recipe_count:
      type: integer
    top_recipe:
      type: string
      nullable: true
      description: >-
        <class>/<recipe> of the recipe with the largest total_meastime on this equipment —
        ranked by MEASUREMENT TIME, not by execution count. A tool mixing QC (60-200 s) and
        ADI (320-900 s) names a different recipe under the two rankings. Ties break on
        full_name so mock and office agree. Null when the equipment ran no recipes in the
        window.
    top_recipe_share:
      type: number
      description: >-
        top_recipe's total_meastime divided by this equipment's total_meastime — a share of
        MEASUREMENT TIME, not of exec_count (0.0 when top_recipe is null). SHARE_CEIL in
        front-dev-home/app/utils/equipmentSignals.ts is calibrated against this number at the
        office, and "share of executions" would call for a materially different constant.
    tat_index:
      type: number
      nullable: true
      description: >-
        Indirect-standardized ratio of actual total_meastime to the TAT this equipment's
        recipe mix would predict. 1.25 = 25% slower than expected. Null when exec_count is
        below TAT_INDEX_MIN_SAMPLE (12) — too few executions for the ratio to be signal.
    occupancy:
      type: number
      description: >-
        total_meastime / window_seconds. NOT MES uptime — meastime excludes loading/queueing/PM,
        so this reads lower than the MES utilization figure.
    usage_ratio:
      type: number
      description: total_meastime / fleet median_total_meastime

  FleetReference:
    tool_count:
      type: integer
    total_executions:
      type: integer
    total_meastime:
      type: integer
    window_seconds:
      type: integer
    median_total_meastime:
      type: number
    median_recipe_count:
      type: number
    min_sample:
      type: integer
      description: Echo of TAT_INDEX_MIN_SAMPLE — the exec_count floor below which tat_index is null
    percentiles:
      type: object
      description: >-
        Keyed by "usage_ratio" | "tat_index" | "occupancy" | "recipe_count", each value an object
        with p10/p25/p50/p75/p90 keys. tat_index excludes equipments with a null tat_index; empty
        object if no equipment qualifies.

  EquipmentsPayload:
    tool_type:
      type: string
    fab_names:
      type: array of string
      description: Echo of the resolved fab filter, uppercased. Empty array when not filtered.
    start_date:
      type: string
      nullable: true
    end_date:
      type: string
      nullable: true
    fleet:
      type: FleetReference
    equipments:
      type: array
      items: EquipmentRow

  EquipmentTrendSeries:
    eqp_id:
      type: string
    points:
      type: array
      items: DailyTrendPoint

  EquipmentRecipeCell:
    eqp_id:
      type: string
    meas_counts:
      type: integer
    total_meastime:
      type: integer
    avg_meastime:
      type: number

  EquipmentRecipeRow:
    class_name:
      type: string
    recipe_name:
      type: string
    full_name:
      type: string
      format: "<class>/<recipe>"
    total_meastime:
      type: integer
      description: Sum across all selected equipments. Sort key for the row order.
    cells:
      type: array
      items: EquipmentRecipeCell
      description: >-
        One cell per requested eqp_id, in request order. An equipment that never ran this
        recipe still gets a cell with zeroed counts — columns must not shift when a tool
        skipped a recipe.

  EquipmentComparePayload:
    tool_type:
      type: string
    fab_names:
      type: array of string
      description: Echo of the resolved fab filter, uppercased. Empty array when not filtered.
    start_date:
      type: string
      nullable: true
    end_date:
      type: string
      nullable: true
    eqp_ids:
      type: array of string
      description: The eqp_id list actually used, after the MAX_EQP_IDS (5) cap — echoed so a silent truncation is never silent.
    trends:
      type: array
      items: EquipmentTrendSeries
    recipes:
      type: array
      items: EquipmentRecipeRow

endpoints:
  - path: /api/cdsem/recipe-tat/ranking
    method: GET
    description: Recipes ranked by total_meastime within the window. Note path prefix is /cdsem/recipe-tat for both CD-SEM and HV-SEM (history — preserve as-is for the office).
    query_params:
      tool_type:
        type: string
        enum: ["cd-sem", "hv-sem"]
        required: true
        description: 400 if missing or not in the enum
      fab_name:
        type: string
        required: false
        description: Strict fab_name match (case-insensitive). R3/R4 do not collapse. Accepts a comma-separated list of fab names (e.g. "R3,M16B") — values are uppercased server-side and matched as a union (합집합) — a row passes if its fab_name matches ANY listed fab.
      start_date:
        type: string
        required: false
        format: "YYYY-MM-DD"
        description: Defaults to ANCHOR_TIME.date() - 30 days
      end_date:
        type: string
        required: false
        format: "YYYY-MM-DD"
        description: Defaults to ANCHOR_TIME.date()
      lot_cd:
        type: string
        required: false
        description: Single lot filter (used by the slideover detail view)
      limit:
        type: integer
        required: false
        description: 1..1000, default 1000
    response:
      status: 200
      body:
        tool_type:
          type: string
        fab_names:
          type: array of string
          description: Echo of the resolved fab filter, uppercased. Empty array when not filtered.
        start_date:
          type: string
        end_date:
          type: string
        limit:
          type: integer
        lot_cd:
          type: string
        rows:
          type: array
          items: RankingRow

  - path: /api/cdsem/recipe-tat/summary
    method: GET
    description: Aggregate counts for the same window
    query_params:
      tool_type:
        type: string
        enum: ["cd-sem", "hv-sem"]
        required: true
      fab_name:
        type: string
        required: false
        description: Comma-separated list of fab names, uppercased server-side; multiple fabs = union (합집합). See the ranking endpoint's fab_name for the full description.
      start_date:
        type: string
        required: false
      end_date:
        type: string
        required: false
      lot_cd:
        type: string
        required: false
    response:
      status: 200
      body: Summary

  - path: /api/cdsem/recipe-tat/daily-trend
    method: GET
    description: Per-day totals for the window
    query_params:
      tool_type:
        type: string
        enum: ["cd-sem", "hv-sem"]
        required: true
      fab_name:
        type: string
        required: false
        description: Comma-separated list of fab names, uppercased server-side; multiple fabs = union (합집합). See the ranking endpoint's fab_name for the full description.
      start_date:
        type: string
        required: false
      end_date:
        type: string
        required: false
      lot_cd:
        type: string
        required: false
    response:
      status: 200
      body:
        tool_type:
          type: string
        fab_names:
          type: array of string
          description: Echo of the resolved fab filter, uppercased. Empty array when not filtered.
        start_date:
          type: string
        end_date:
          type: string
        lot_cd:
          type: string
        points:
          type: array
          items: DailyTrendPoint

  - path: /api/cdsem/recipe-tat/devices
    method: GET
    description: Per-lot totals within the window — used by the device slideover lot picker
    query_params:
      tool_type:
        type: string
        enum: ["cd-sem", "hv-sem"]
        required: true
      fab_name:
        type: string
        required: false
        description: Comma-separated list of fab names, uppercased server-side; multiple fabs = union (합집합). See the ranking endpoint's fab_name for the full description.
      start_date:
        type: string
        required: false
      end_date:
        type: string
        required: false
    response:
      status: 200
      body:
        tool_type:
          type: string
        fab_names:
          type: array of string
          description: Echo of the resolved fab filter, uppercased. Empty array when not filtered.
        start_date:
          type: string
        end_date:
          type: string
        devices:
          type: array
          items: DeviceRow

  - path: /api/cdsem/recipe-tat/equipments
    method: GET
    description: Per-equipment fleet table for the window — one row per eqp_id that ran at least one recipe, plus a fleet-wide reference block for badge thresholds (usage_ratio/tat_index/occupancy/recipe_count percentiles).
    query_params:
      tool_type:
        type: string
        enum: ["cd-sem", "hv-sem"]
        required: true
      fab_name:
        type: string
        required: false
        description: Comma-separated list of fab names, uppercased server-side; multiple fabs = union (합집합). See the ranking endpoint's fab_name for the full description.
      start_date:
        type: string
        required: false
      end_date:
        type: string
        required: false
    response:
      status: 200
      body: EquipmentsPayload

  - path: /api/cdsem/recipe-tat/equipment-compare
    method: GET
    description: Trend + recipe-matrix comparison for up to 5 selected equipments within the window.
    query_params:
      tool_type:
        type: string
        enum: ["cd-sem", "hv-sem"]
        required: true
      fab_name:
        type: string
        required: false
        description: Comma-separated list of fab names, uppercased server-side; multiple fabs = union (합집합). See the ranking endpoint's fab_name for the full description.
      start_date:
        type: string
        required: false
      end_date:
        type: string
        required: false
      eqp_id:
        type: string
        required: false
        description: Comma-separated list of eqp_id, NOT uppercased (exact-match key, unlike fab_name). Capped at 5 — extras beyond MAX_EQP_IDS are silently dropped, then echoed back via the response's eqp_ids so the truncation is visible.
    response:
      status: 200
      body: EquipmentComparePayload

notes:
  - Office must anchor the date window on max(timestamp) from the source index — do NOT use wall-clock now(). Phase 1 mock anchors on import-time wall-clock (ANCHOR_TIME) which drifts; production should be deterministic per query.
  - Source schema is docs/datatables/hitachi/meas_hist.txt. The TAT dashboard only needs timing fields; office should drop msr/align/image counts and idp paths just like the mock does, to keep payloads small.
  - The path prefix /cdsem/recipe-tat is used for both tool types — clients pass tool_type as a query param. Do not split into /cdsem/... and /hvsem/... paths in the office.
  - lru_cache(maxsize=256) on _filter_rows in the mock keys on (tool_type, fab_names, start_date, end_date, lot_cd), where fab_names is the resolved tuple of uppercased fab names (hashable, required by lru_cache) — not the raw comma-separated fab_name query string. Office should cache the filter result similarly since each page hit triggers ranking + summary + daily-trend + devices with identical filters.
  - equipments and equipment-compare do not accept lot_cd — they answer "what equipment exists / how do these equipments compare" and must not be narrowed by the lot-detail slideover's selection.
  - tat_index is null below TAT_INDEX_MIN_SAMPLE (12) executions; top_recipe is null when an equipment ran zero recipes in the window. Both nulls are meaningful (insufficient sample / no data), not missing-field bugs — the frontend should render them as "—", not 0.
