resource: hardware
description: >
  CD-SEM/HV-SEM hardware service payloads for BM/PM, BSM (beam shape),
  Reso Center, FDC (focus drift compensation), MDC (magnification drift
  compensation), and SCE (scan-charge elimination).
base_path: /api/{tool_slug}/hardware/{eqp_id}/{service}

types:
  HardwareMetricCard:
    key:
      type: string
      description: Stable metric key for frontend rendering.
      examples: ["last_bm_date", "row_count"]
    label:
      type: string
      description: Display label for the metric.
      examples: ["Last BM", "Rows"]
    value:
      type: string|integer|float|boolean|null
      description: Metric value after backend normalization.
      examples: ["2026-04-22", 8]
    unit:
      type: string
      required: false
      description: Optional unit suffix.
      examples: ["hours"]
    tone:
      type: string
      required: false
      enum: ["neutral", "ok", "warning", "bad"]
      description: Optional semantic display tone.

  HardwareTableColumn:
    key:
      type: string
      description: Row key to read for this column.
      examples: ["event", "date", "status"]
    label:
      type: string
      description: Display label for this column.
      examples: ["Event", "Date", "Status"]

  HardwareTableSection:
    key:
      type: string
      description: Stable table section key.
      examples: ["maintenance_schedule"]
    title:
      type: string
      description: Display title for the section.
      examples: ["Maintenance Schedule"]
    columns:
      type: array
      items: HardwareTableColumn
      description: Columns used to render each row.
    rows:
      type: array
      items: object
      description: Normalized row objects keyed by column key.

  HardwarePayload:
    tool_slug:
      type: string
      enum: ["cdsem", "hvsem"]
      description: Tool family slug from the route.
    service:
      type: string
      enum: ["bsm", "reso-center", "fdc", "mdc", "sce", "bm-pm"]
      description: Hardware service key from the route.
    eqp_id:
      type: string|null
      description: Selected equipment ID, if provided.
    fab_name:
      type: string|null
      description: Selected fab name, if provided.
    available:
      type: boolean
      description: Whether this service has data for the selected scope.
    fetched_at:
      type: string
      format: ISO-8601
      description: Backend fetch timestamp.
    summary:
      type: string
      description: Human-readable status summary.
    cards:
      type: array
      items: HardwareMetricCard
      description: Normalized metrics for compact rendering.
    tables:
      type: array
      items: HardwareTableSection
      description: Normalized detail sections for tabular rendering.
    docs:
      type: array
      items: object
      required: false
      description: Faithful time-series raw docs (bsm / reso-center / fdc), ascending time.
    settings:
      type: object
      required: false
      description: Faithful dict-of-dict (mdc / sce) — selected eqp + in-fab siblings.

endpoints:
  - path: /api/{tool_slug}/hardware/{eqp_id}/{service}
    method: GET
    description: Return one normalized hardware service payload.
    path_params:
      tool_slug:
        type: string
        enum: ["cdsem", "hvsem"]
        description: Tool family.
      eqp_id:
        type: string
        description: "Equipment ID (required path segment; '_' = none selected yet)."
      service:
        type: string
        enum: ["bsm", "reso-center", "fdc", "mdc", "sce", "bm-pm"]
        description: Hardware service to fetch.
    query_params:
      fab_name:
        type: string
        required: false
        description: "Fab name scope hint; required for mdc/sce siblings."
      start:
        type: string
        format: ISO-8601
        required: false
        description: "Start of the time window (default: last 30 days). Ignored for mdc/sce."
      end:
        type: string
        format: ISO-8601
        required: false
        description: "End of the time window (default: last 30 days). For mdc/sce this is the as-of date; start is ignored."
    response:
      status: 200
      body: HardwarePayload
    example_request: "GET /api/cdsem/hardware/ECXDX204/mdc?fab_name=M16B&end=2026-05-24"
    example_response:
      tool_slug: cdsem
      service: mdc
      eqp_id: ECXDX204
      fab_name: M16B
      available: true
      fetched_at: "2026-05-24T00:00:00+00:00"
      summary: 선택 장비와 동일 fab 장비의 MDC 보정 계수 스냅샷(as-of)을 제공합니다.
      cards:
        - { key: as_of, label: 기준일, value: "2026-05-24", tone: neutral }
        - { key: sibling_count, label: 동일 fab 장비, value: 4, unit: 대, tone: neutral }
      tables: []
      settings:
        ECXDX204:
          "800V_HR_0Deg": "1.004984"
          "800V_HR_90Deg": "1.005625"
          "500V_HR_0Deg": "1.004096"
          "500V_HR_90Deg": "1.003888"
