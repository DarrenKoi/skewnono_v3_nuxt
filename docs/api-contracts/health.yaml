resource: health
description: Backend service liveness for the landing-page status card. Home returns synthetic latencies; office times real pings against Redis / OpenSearch / MinIO.
base_path: /api/health

types:
  ServiceHealth:
    id:
      type: string
      enum: ["redis", "opensearch", "minio"]
      description: Stable service id used as Vue list key
    label:
      type: string
      description: Human-readable name shown in the UI ("Redis", "OpenSearch", "MinIO")
    status:
      type: string
      enum: ["up", "down"]
      description: Liveness — "up" = probe returned, "down" = probe raised or timed out. Drives dot color and badge label.
    latency_ms:
      type: integer
      nullable: true
      description: Round-trip time of the health probe in milliseconds. null when status is "down" (no successful response).
    detail:
      type: string
      description: Short context line (version / node count / cluster color / failure reason)

  ServicesHealthResponse:
    checked_at:
      type: string
      format: "ISO 8601 UTC"
      description: Timestamp the probe was run on the server. Frontend currently does not render this; kept in the contract so Phase 2 / 3 can wire it back without a breaking change.
    services:
      type: array
      items: ServiceHealth

endpoints:
  - path: /api/health/logging
    method: GET
    description: Delivery diagnostics for the OpenSearch log shipper. Runtime introspection like /api/health/providers — reads the installed handler directly, so silent document loss (queue-full or bulk drops) is observable instead of only shrinking the activity metrics.
    response:
      status: 200
      body: "installed: bool, target: {alias, deployment} | null, diagnostics: {enqueued, indexed, queue_full_dropped, bulk_dropped, dropped, retries, bulk_failures, last_success_at, last_failure_at, queue_depth} | null"
    example_request: "GET /api/health/logging"
    example_response:
      installed: true
      target:
        alias: "skewnono_logging_local"
        deployment: "local"
      diagnostics:
        enqueued: 1240
        indexed: 1240
        queue_full_dropped: 0
        bulk_dropped: 0
        dropped: 0
        retries: 2
        bulk_failures: 1
        last_success_at: "2026-07-27T12:00:05+00:00"
        last_failure_at: "2026-07-27T11:59:58+00:00"
        queue_depth: 3
  - path: /api/health/services
    method: GET
    description: Snapshot of liveness for the three backing services. Cheap to call; frontend fetches once on page mount.
    response:
      status: 200
      body: ServicesHealthResponse
    example_request: "GET /api/health/services"
    example_response:
      checked_at: "2026-05-08T07:16:00+00:00"
      services:
        - id: "redis"
          label: "Redis"
          status: "up"
          latency_ms: 2
          detail: "6.2.7 · 1 node"
        - id: "opensearch"
          label: "OpenSearch"
          status: "up"
          latency_ms: 14
          detail: "2.11 · 3 nodes · green"
        - id: "minio"
          label: "MinIO"
          status: "down"
          latency_ms: null
          detail: "connect timeout"

notes:
  - Phase 1 source is back_dev_home/health/data.py, which returns fixed always-up values for the three services because OpenSearch and MinIO are not reachable from home. Only checked_at varies per request. No fixture is captured because the office response is intrinsically time-varying.
  - Office implementation should keep the same TypedDict shape and reuse the in-repo helpers — redis-py for Redis (ping()), ops_store.create_client() for OpenSearch (ping() or cluster.health()), minio_store.create_client() for MinIO (list_buckets() or bucket_exists()). Wrap each in try/except, measure wall-clock around the call, and convert to int ms.
  - Map probe results to status — "up" if the probe returned successfully (regardless of latency), "down" if it raised / timed out. Set latency_ms to None on "down".
  - Endpoint stays cheap (single-digit ms in the happy path) so future polling can be reintroduced without re-architecting if Phase 2 / 3 wants live status.
