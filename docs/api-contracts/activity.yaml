resource: activity
description: >-
  /activity 사용 통계 화면의 HTTP 계약입니다. home provider는 결정론적
  인메모리 데이터를 반환하고, office provider는 SKEWNONO_LOG_ENV가 선택한
  OpenSearch skewnono_logging alias의 canonical request document를 집계합니다.
base_path: /api/activity

source:
  home: backend/activity/providers/mock.py
  office: backend/activity/providers/opensearch_reader.py
  office_storage: skewnono_logging*
  office_client: ops_store.OSSearch
  office_fallback: none

time_semantics:
  storage: UTC
  calendar_timezone: Asia/Seoul
  dau: 현재 KST 날짜의 00:00부터 조회 시각까지의 distinct active user
  wau: 오늘을 포함한 최근 7개 KST 날짜의 distinct active user
  mau: 오늘을 포함한 최근 30개 KST 날짜의 distinct active user
  this_month: 현재 KST calendar month
  daily: 오늘을 포함한 최근 30개 KST 날짜
  first_seen: >-
    현재 선택 alias의 보존 구간 안에서 가장 이른 활동 시각입니다. 시스템 전체
    lifetime 최초 시각이 아닙니다.

activity_filter:
  event: request
  activity_weight: 1
  activity_kind:
    - entry
    - feature
    - page_view
  active_user_metrics: >-
    entry와 feature만 포함합니다(page_view 제외). dau/wau/mau, this_month,
    daily sparkline, 사용자 목록의 requests_30d/days_active_30d가 여기 속합니다.
  feature_rankings: >-
    page_view만 포함합니다(entry, feature 제외). top_features, top_features_7d/30d,
    favorite_feature가 여기 속합니다. POST /api/page-view가 남긴 행만 순위에
    들어갑니다.
  fab_page_rankings: >-
    2단계 필터입니다(_fab_window). 전체 fab query 자체가 entry+feature로
    걸려 있어 /api/activity/fabs의 fab별 total과 active_users(사용자 수
    cardinality)는 entry를 포함합니다. 그 아래 pages sub-aggregation만 다시
    feature 하나로 좁혀 entry를 뺍니다. page_view는 두 단계 모두에서
    제외됩니다 — beacon 문서에는 fab_name이 없습니다.
  presence_metrics: >-
    kind로 거르지 않습니다. first_seen/last_seen은 요청량이 아니라 "마지막으로
    본 시각"을 묻는 질문이라 page_view도 포함합니다.
  family_page_rankings: >-
    page_view만 읽습니다. /api/activity/families의 total(그 장비군의 화면을 연
    distinct user 수)과 pages(feature별 page open 수)가 모두 여기 속합니다.
    fab_page_rankings와 달리 request 행을 쓰지 않습니다 — beacon은 화면 경로를
    보내므로 tool_family가 page_view 행에 정확히 실립니다. total은 DAU식
    active user가 아니며 장비군끼리 더할 수 없습니다.
  no_backfill: >-
    2026-08-04 이전에 기록된 문서는 모두 activity_kind=feature이며 page_view로
    재분류되지 않습니다. 따라서 feature_rankings는 배포 시점부터 빈 상태로
    시작해 최대 30일에 걸쳐 채워집니다. (OFFICE-VERIFY: 실제 office
    OpenSearch에서 검증되지 않았습니다.)

types:
  FeatureCount:
    feature:
      type: string
      description: route_to_feature 또는 page_to_feature가 만든 안정적인 feature slug입니다.
    count:
      type: integer
      description: >-
        해당 기간의 문서 수입니다. 이 type을 쓰는 필드마다 어떤 activity_kind를
        세는지가 다릅니다 — top_features/top_features_7d/30d/favorite_feature는
        page_view만, FabUsageRow.pages는 feature만 셉니다. 필드별 설명을
        참조하세요.

  DailyCount:
    date:
      type: string
      format: YYYY-MM-DD
      description: KST calendar date입니다.
    count:
      type: integer
      description: 해당 사용자의 entry와 feature 활동 요청 수입니다.

  MeThisMonth:
    requests:
      type: integer
      description: 현재 KST 월의 entry와 feature 활동 요청 수입니다.
    days_active:
      type: integer
      description: 현재 KST 월의 distinct 활동일 수입니다.

  MeResponse:
    visits:
      type: array
      description: >-
        오늘을 포함한 최근 90개 KST 날짜의 page_view 기록입니다.
        각 항목은 date(YYYY-MM-DD), count(페이지 조회 수)이며 API 요청 수와 별개입니다.
        기록이 없는 날짜는 0입니다. 수집 시작 이전이나 보존 기간 밖의 기록은 복원하지 않습니다.
    user_id:
      type: string
    is_admin:
      type: boolean
      description: 향후 관리자 UI를 위한 값이며 공유 activity 조회를 제한하지 않습니다.
    this_month:
      type: object
      shape: MeThisMonth
    top_features:
      type: array
      items: FeatureCount
      description: >-
        보존 구간 전체에서 page_view 수 기준 상위 10개입니다(2026-08-04 이전
        activity_kind=feature 문서는 집계되지 않습니다).
    daily:
      type: array
      items: DailyCount
      description: 최근 30개 KST 날짜이며 활동이 없는 날짜도 count 0으로 포함합니다.
    first_seen:
      type: string
      format: ISO 8601 UTC
      nullable: true
    last_seen:
      type: string
      format: ISO 8601 UTC
      nullable: true

  SummaryResponse:
    generated_at:
      type: string
      format: ISO 8601 UTC
    dau:
      type: integer
      description: 현재 KST 날짜의 distinct active user 수입니다.
    wau:
      type: integer
      description: trailing 7 KST 날짜의 distinct active user 수입니다.
    mau:
      type: integer
      description: trailing 30 KST 날짜의 distinct active user 수입니다.
    top_features_7d:
      type: array
      items: FeatureCount
      description: trailing 7 KST 날짜의 page_view 상위 10개입니다.
    top_features_30d:
      type: array
      items: FeatureCount
      description: trailing 30 KST 날짜의 page_view 상위 10개입니다.

  UserListRow:
    user_id:
      type: string
    requests_30d:
      type: integer
      description: trailing 30 KST 날짜의 entry와 feature 요청 수입니다.
    days_active_30d:
      type: integer
      description: trailing 30 KST 날짜의 distinct 활동일 수입니다.
    last_seen:
      type: string
      format: ISO 8601 UTC
      nullable: true
    favorite_feature:
      type: string
      nullable: true
      description: trailing 30 KST 날짜에서 page_view 수가 가장 많은 slug입니다.

  NamedUserListRow:
    description: >-
      UserListRow에 member directory의 이름과 소속 팀을 붙인 형태이며,
      /api/activity/users가 실제로 반환하는 행입니다. logging store는 사번만
      기록하므로 provider는 이 두 필드를 만들 수 없고, routes.py가
      _auth.directory에서 조회해 붙입니다. directory의 organ_cd와
      upper_organ_nm은 화면에 표시하지 않으므로 포함하지 않습니다.
    extends: UserListRow
    emp_nm:
      type: string
      nullable: true
      description: >-
        Redis `members` 해시의 이름입니다. 해당 사번의 row가 없거나 directory를
        조회할 수 없으면 null이며, 이때 화면은 사번만 표시합니다.
    dept_nm:
      type: string
      nullable: true
      description: >-
        Redis `members` 해시의 소속 팀명입니다. member row는 부분적일 수 있어
        emp_nm과 독립적으로 null일 수 있으며, 이때 화면은 —를 표시합니다.

  UserListResponse:
    generated_at:
      type: string
      format: ISO 8601 UTC
    users:
      type: array
      items: NamedUserListRow
      description: >-
        전체 사용자를 requests_30d 내림차순, user_id 오름차순으로 정렬합니다.
        OpenSearch composite aggregation을 끝까지 순회하며 HTTP pagination은 없습니다.

  UserHistoryResponse:
    visits:
      type: array
      description: MeResponse.visits와 같은 90일 page_view 기록입니다.
    user_id:
      type: string
    this_month:
      type: object
      shape: MeThisMonth
    top_features:
      type: array
      items: FeatureCount
    daily:
      type: array
      items: DailyCount
    first_seen:
      type: string
      format: ISO 8601 UTC
      nullable: true
    last_seen:
      type: string
      format: ISO 8601 UTC
      nullable: true

  FabUsageRow:
    fab:
      type: string
      description: >-
        정규화된 FAB 이름입니다. fab_name_list가 비어 있는 문서는 "미지정"입니다.
    total:
      type: integer
      description: 해당 기간과 FAB의 distinct active user 수입니다.
    pages:
      type: array
      items: FeatureCount
      description: 해당 FAB에서 발생한 feature request 수 기준 상위 10개입니다.

  FamilyUsageRow:
    family:
      type: string
      enum: [cdsem, hvsem, veritysem, provision, afm]
      description: >-
        로그의 tool_family 값입니다. registry slug이며 화면 경로의 `cd-sem`
        표기가 아닙니다.
    total:
      type: integer
      description: >-
        해당 기간에 그 장비군의 화면을 연 distinct user 수입니다(page_view 기준).
        DAU식 active user 수가 아니고, 두 장비군을 쓰는 사람은 양쪽에 모두
        들어가므로 더할 수 없습니다.
    pages:
      type: array
      items: FeatureCount
      description: 그 장비군에서 열린 page_view 수 기준 상위 10개 feature입니다.

  FamilyUsageResponse:
    generated_at:
      type: string
      format: ISO 8601 UTC
    families_7d:
      type: array
      items: FamilyUsageRow
      description: >-
        모든 장비군을 registry 순서(cdsem, hvsem, veritysem, provision, afm)로
        담습니다. 아무도 열지 않은 장비군도 total=0, pages=[]로 포함합니다.
    families_30d:
      type: array
      items: FamilyUsageRow

  FabUsageResponse:
    generated_at:
      type: string
      format: ISO 8601 UTC
    fabs_7d:
      type: array
      items: FabUsageRow
    fabs_30d:
      type: array
      items: FabUsageRow

  DailyVisitors:
    date:
      type: string
      format: YYYY-MM-DD (KST)
    visitors:
      type: integer
      description: >-
        해당 KST 날짜에 request 행(entry, feature)이 1건 이상 있는 distinct
        user_id 수입니다. DAU와 같은 정의이므로 마지막 항목은
        SummaryResponse.dau와 같습니다. page_view만 있는 사용자는 세지 않습니다.
        날짜별 값은 더할 수 없습니다 — 이틀 활동한 사람은 양쪽에 모두 들어갑니다.
    wau:
      type: integer
      description: >-
        해당 날짜를 마지막으로 하는 7 KST 날짜 동안의 distinct user_id 수입니다.
        달력 주가 아니라 rolling window이며, 마지막 항목은 SummaryResponse.wau와
        같습니다. visitors를 더해서는 얻을 수 없어 따로 보냅니다.
    mau:
      type: integer
      description: >-
        해당 날짜를 마지막으로 하는 30 KST 날짜 동안의 distinct user_id 수입니다.
        마지막 항목은 SummaryResponse.mau와 같습니다. 첫 날짜의 mau를 계산하려고
        provider는 60일이 아니라 89일치 request 행을 읽습니다.

  VisitorsResponse:
    generated_at:
      type: string
      format: ISO 8601 UTC
    days:
      type: array
      items: DailyVisitors
      description: >-
        오늘을 마지막으로 하는 연속 60 KST 날짜이며 오래된 날짜가 먼저 옵니다.
        활동이 없는 날도 0으로 포함합니다. /admin/visitors 화면의 2주/1개월/2개월
        선택은 이 배열을 뒤에서 잘라 쓰며 요청을 다시 보내지 않습니다.

endpoints:
  - path: /api/activity/me
    method: GET
    auth: signed-in user
    description: 현재 사용자의 개인 활동 통계입니다.
    response:
      status: 200
      body: MeResponse

  - path: /api/activity/summary
    method: GET
    auth: signed-in user
    description: DAU, trailing 7-day WAU, trailing 30-day MAU와 feature 순위입니다.
    response:
      status: 200
      body: SummaryResponse

  - path: /api/activity/users
    method: GET
    auth: signed-in user
    description: trailing 30 KST 날짜의 전체 사용자별 통계입니다.
    response:
      status: 200
      body: UserListResponse

  - path: /api/activity/users/{user_id}
    method: GET
    auth: signed-in user
    description: 선택한 사용자의 개인 활동 통계입니다.
    response:
      status: 200
      body: UserHistoryResponse
    errors:
      - status: 404
        code: not_found
        when: 선택한 alias의 보존 구간에 해당 사용자의 활동 문서가 없음

  - path: /api/activity/families
    method: GET
    auth: signed-in user
    description: trailing 7일과 30일의 장비군별 page open 사용자 수와 화면 순위입니다.
    response:
      status: 200
      body: FamilyUsageResponse

  - path: /api/activity/visitors
    method: GET
    auth: admin
    description: trailing 60 KST 날짜의 일별 DAU와 rolling WAU·MAU입니다.
    response:
      status: 200
      body: VisitorsResponse
    errors:
      - status: 403
        code: forbidden
        when: 관리자가 아니거나 신뢰할 수 없는 identity source임

  - path: /api/activity/fabs
    method: GET
    auth: signed-in user
    description: trailing 7일과 30일의 FAB별 active user와 feature page 사용량입니다.
    response:
      status: 200
      body: FabUsageResponse

  - path: /api/page-view
    method: POST
    auth: signed-in user
    description: >-
      Nuxt SPA가 다른 페이지를 열 때마다 쏘는 beacon입니다. /api/activity 하위가
      아니라 최상위에 마운트되어 있습니다 — /api/activity는 operation prefix라
      거기 두면 모든 page view가 activity_weight=0으로 분류됩니다. path가 알려진
      페이지로 resolve되면 activity_kind=page_view, feature=해당 페이지 slug,
      tool_family=그 페이지가 속한 장비군(없으면 필드 생략)인 로그 행 1건이
      기록됩니다(beacon 자신의 경로가 아닙니다). SPA는 (slug, 장비군)이 바뀔
      때 beacon을 보내므로 CD-SEM storage에서 HV-SEM storage로 옮기면 한 번 더
      기록됩니다. resolve되지
      않는 path(운영 페이지, 아직 URL에 반영되지 않은 tab 등)는 조용히
      무시하고 204를 돌려줍니다 — 클라이언트는 어떤 path가 순위에 들어가는지
      알 수 없으므로 400으로 취급하지 않습니다.
    request_body:
      path:
        type: string
        description: >-
          query를 포함한 프론트엔드 route path입니다. 예:
          /ebeam/cd-sem/M14/recipe-status?tab=tat
    response:
      status: 204
      body: none
      description: 정상 접수입니다. 순위 반영 여부는 path가 알려진 페이지인지에 달려 있습니다.
    errors:
      - status: 400
        code: bad_request
        message: path is required
        when: path가 없거나 공백뿐인 문자열인 경우

errors:
  - status: 503
    code: activity_query_failed
    message: Could not query OpenSearch activity
    when: >-
      office logging target 설정, alias, 자격 증명 또는 OpenSearch 조회가 실패한 경우

notes:
  - >-
    한 문서의 fab_name_list에 여러 FAB가 있으면 각 FAB bucket에 포함됩니다.
    한 사용자가 여러 FAB에서 활동할 수도 있으므로 FAB별 total의 합은 전체
    active user 수보다 클 수 있습니다.
  - >-
    entry 요청은 active user, 개인 요청 수, 활동일, first_seen, last_seen에
    포함되지만 top feature, favorite feature, FAB pages에는 포함되지 않습니다.
  - >-
    page_view는 반대입니다 — top feature, favorite feature 순위에는 포함되지만
    active user 수, 개인 요청 수(this_month/requests_30d), 활동일에는
    포함되지 않습니다. first_seen/last_seen에는 entry/feature와 마찬가지로
    포함됩니다. FAB pages는 page_view를 아예 쓰지 않습니다(beacon에
    fab_name이 없음). (2026-08-04)
  - >-
    page_view는 2026-08-04 배포로 처음 기록되기 시작했고 backfill이 없습니다.
    그 이전 문서는 activity_kind=feature로 남아 있어 top feature/favorite
    feature 순위에서 보이지 않으므로, 이 순위들은 배포 시점부터 빈 상태로
    시작해 최대 30일에 걸쳐 채워집니다. (OFFICE-VERIFY: 실제 office
    OpenSearch에서는 아직 검증되지 않았습니다.)
  - >-
    API token 요청, 익명 요청, 실패 응답, operation, background 요청은 canonical
    로그에는 남을 수 있지만 activity_weight가 0이므로 활동 지표에서 제외됩니다.
  - >-
    office provider에는 Redis counter, mock 데이터 또는 인메모리 데이터로의
    자동 fallback이 없습니다. 실패를 503으로 명시합니다.
