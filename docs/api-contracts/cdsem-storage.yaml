resource: cdsem-storage
description: CD-SEM tool storage utilization and "missing snapshot" inventory. Hitachi CG/GT models only — see classifyToolType() in useSemListApi.ts.
base_path: /api/cdsem

types:
  StorageRow:
    eqp_id:
      type: string
      examples: ["ECDX234", "HCDX567"]
    eqp_ip:
      type: string
      format: "IPv4 (177.x.x.x or 197.x.x.x)"
    fac_id:
      type: string
      examples: ["M10", "M11", "M14", "M15", "M16", "R3"]
    fab_name:
      type: string
      description: Same convention as sem-list (M-class fabs use suffix A/B/C; R-class is R3 or R4)
    eqp_model_cd:
      type: string
      enum: ["CG6300", "CG6320", "CG6340", "CG6360", "CG6380", "GT2000", "GT2000S"]
    total:
      type: string
      format: "<int>G or <float>T"
      description: Human-readable total storage size
      examples: ["750G", "999G", "1.5T"]
    used:
      type: string
      format: "<int>G or <float>T"
    avail:
      type: string
      format: "<int>G or <float>T"
    percent:
      type: string
      format: "<int>%"
    storage_mt:
      type: string
      format: "ISO 8601 UTC ending in Z"
      description: Last storage-monitor sample timestamp
    storage_mt_date:
      type: string
      format: "YYYY-MM-DD"
      description: Date portion of storage_mt for table grouping
    rcp_counts:
      type: integer
      description: Recipe count on the tool. Cap is 50000; UI shows warning >49000, critical >49800.
    rcp_counts_mt:
      type: string
      format: "ISO 8601 UTC ending in Z"

  UnavailableRow:
    eqp_id:
      type: string
    eqp_ip:
      type: string
    fac_id:
      type: string
    fab_name:
      type: string
    eqp_model_cd:
      type: string
    missing_days_streak:
      type: integer
      description: Consecutive days the tool has been missing from snapshots, ending at latest_date

  StorageUnavailableSnapshot:
    latest_date:
      type: string
      format: "YYYY-MM-DD"
    rows:
      type: array
      items: UnavailableRow

endpoints:
  - path: /api/cdsem/storage
    method: GET
    description: All CD-SEM tools with storage and recipe-count snapshots
    query_params:
      fac_id:
        type: string
        required: false
        description: Comma-separated fac_ids to filter by (e.g. "R3,M11"). Case-insensitive.
    response:
      status: 200
      body:
        type: array
        items: StorageRow

  - path: /api/cdsem/storage-unavailable
    method: GET
    description: Latest snapshot of CD-SEM tools missing from storage inventory, with consecutive-missing streak
    query_params:
      fac_id:
        type: string
        required: false
    response:
      status: 200
      body: StorageUnavailableSnapshot

notes:
  - Phase 1 generator seeds 300 tools with deterministic random.Random(seed=42) and 8 days of unavailable snapshots from random.Random(seed=43). Office should query the same monitoring index that feeds these dashboards.
  - Tool-type scope is enforced server-side here (CD-SEM only). The HV-SEM mirror lives at /api/hvsem/storage.
  - rcp_counts thresholds (49000 warn, 49800 critical) are UI conventions; preserve them in the office implementation since the frontend has no fallback values.
