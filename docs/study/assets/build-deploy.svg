<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="title"><title id="title">개발 · 빌드 · 사내 배포</title><rect width="600" height="640" fill="#fff"/><g fill="#172c40" font-family="system-ui,sans-serif"><text x="300" y="35" text-anchor="middle" font-size="22" font-weight="700">개발 · 빌드 · 사내 배포</text><rect x="20" y="70" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="100" text-anchor="middle" font-size="20" font-weight="700">소스와 개발 환경</text><text x="300" y="128" text-anchor="middle" font-size="16">Node는 Nuxt 개발/빌드, Python은 API 실행</text><path d="M300 150v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="180" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="210" text-anchor="middle" font-size="20" font-weight="700">nuxt generate · ssr: false</text><text x="300" y="238" text-anchor="middle" font-size="16">frontend/.output/public 정적 산출물</text><path d="M300 260v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="290" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="320" text-anchor="middle" font-size="20" font-weight="700">사무실에서 pack.py</text><text x="300" y="348" text-anchor="middle" font-size="16">빌드 + backend + 사내 gitignored 설정 포함</text><path d="M300 370v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="400" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="430" text-anchor="middle" font-size="20" font-weight="700">기존 /project/workSpace에 오버레이</text><text x="300" y="458" text-anchor="middle" font-size="16">영구 index.py / wsgi.ini / chat.db 유지</text><path d="M300 480v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="510" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="540" text-anchor="middle" font-size="20" font-weight="700">preflight → 재기동 → health 확인</text><text x="300" y="568" text-anchor="middle" font-size="16">사내 실제 연결·권한·작업·로그는 별도 확인</text></g></svg>