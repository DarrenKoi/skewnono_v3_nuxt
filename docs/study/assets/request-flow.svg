<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" role="img" aria-labelledby="title desc"><title id="title">개발과 운영 요청의 두 경로</title><desc id="desc">브라우저의 API 요청은 개발에서는 Nitro 프록시, 운영에서는 uWSGI를 거쳐 Flask로 갑니다. 정적 파일도 운영 uWSGI와 Flask가 제공합니다. 두 서버를 순서대로 거치는 것이 아닙니다.</desc><rect width="600" height="580" fill="#fff"/><g fill="#172c40" font-family="system-ui,sans-serif"><text x="300" y="35" text-anchor="middle" font-size="22" font-weight="700">요청의 경계: 개발과 사내 운영</text><rect x="40" y="65" width="520" height="75" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="95" text-anchor="middle" font-size="20" font-weight="700">브라우저의 Vue SPA</text><text x="300" y="123" text-anchor="middle" font-size="16">화면 → composable → /api 상대 경로</text><path d="M300 140v20H150v25m150-25h150v25" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="185" width="270" height="105" rx="10" fill="#eef5fc" stroke="#255372"/><rect x="310" y="185" width="270" height="105" rx="10" fill="#eef5fc" stroke="#255372"/><text x="155" y="213" text-anchor="middle" font-size="19" font-weight="700">개발: Nuxt / Nitro</text><text x="155" y="241" text-anchor="middle" font-size="16">기본 :3000 · devProxy</text><text x="155" y="269" text-anchor="middle" font-size="16">Flask :5050 /api로 전달</text><text x="445" y="213" text-anchor="middle" font-size="19" font-weight="700">운영: uWSGI</text><text x="445" y="241" text-anchor="middle" font-size="16">추적 설정 HTTP :5000</text><text x="445" y="269" text-anchor="middle" font-size="16">정적 파일과 API 같은 origin</text><path d="M150 290v30h150m150-30v30H300v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="40" y="345" width="520" height="75" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="375" text-anchor="middle" font-size="20" font-weight="700">Flask: 신원 → route → data.py</text><text x="300" y="404" text-anchor="middle" font-size="16">권한·오류·활동 로그 / JSON 응답 계약</text><path d="M300 421v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="40" y="447" width="520" height="85" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="479" text-anchor="middle" font-size="20" font-weight="700">선택된 provider</text><text x="300" y="511" text-anchor="middle" font-size="16">mock: 로컬 자료 / office: 사내 저장소</text><text x="300" y="561" text-anchor="middle" font-size="16">응답은 요청한 경로를 되돌아 브라우저로 갑니다.</text></g></svg>
