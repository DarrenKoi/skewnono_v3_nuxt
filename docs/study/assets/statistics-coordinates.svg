<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 630" role="img" aria-labelledby="title desc"><title id="title">극단값의 통계 영향과 웨이퍼 물리·격자 좌표</title><desc id="desc">9,10,11,12,100에서 중앙값은11, 평균은28.4, raw MAD는1입니다. 웨이퍼 중심 원점에서 die 1,0 중심은12.52mm,4.61mm입니다. 그림의 점 간격과 웨이퍼는 이해를 위한 도식이며 실측 비례 축척이 아닙니다.</desc><rect width="620" height="630" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#172c40"><text x="310" y="32" text-anchor="middle" font-size="22" font-weight="700">극단값과 좌표를 서로 다른 질문으로 읽습니다</text><text x="25" y="73" font-size="19">중앙값 11 · 평균 28.4 · raw MAD 1</text><path d="M40 130H575" stroke="#255372" stroke-width="2"/><g fill="#064f88"><circle cx="80" cy="130" r="6"/><circle cx="87" cy="130" r="6"/><circle cx="94" cy="130" r="6"/><circle cx="101" cy="130" r="6"/><circle cx="535" cy="130" r="7"/></g><text x="50" y="164" font-size="17">9 · 10 · 11 · 12</text><text x="510" y="164" font-size="17">100</text><path d="M182 94v30" stroke="#a54200" stroke-width="3"/><text x="164" y="85" font-size="16" fill="#934100">평균</text><text x="25" y="205" font-size="17">13을 100으로 바꾸면 평균·σ는 커지고 중앙값·MAD는 유지됩니다.</text><path d="M25 225H595" stroke="#c5d1db"/><text x="25" y="261" font-size="20" font-weight="700">300 mm 웨이퍼 · 중심 원점의 mm 좌표</text><circle cx="215" cy="410" r="126" fill="#f4f8fb" stroke="#255372" stroke-width="2"/><path d="M65 410H365M215 550V278" stroke="#255372" stroke-width="2"/><text x="350" y="434" font-size="17">+x</text><text x="224" y="292" font-size="17">+y</text><circle cx="215" cy="410" r="4" fill="#172c40"/><text x="122" y="440" font-size="16">물리 중심 (0,0)</text><rect x="230" y="346" width="65" height="50" fill="#e4eff9" stroke="#064f88"/><circle cx="262" cy="371" r="6" fill="#a54200"/><path d="M262 371H390" stroke="#a54200" stroke-width="2"/><text x="395" y="360" font-size="17">die (1,0) 중심</text><text x="395" y="385" font-size="17">(12.52,4.61) mm</text><text x="395" y="420" font-size="16">x: index × pitch</text><text x="395" y="445" font-size="16">y: map_offset 4.61</text><text x="25" y="578" font-size="17">stage: (162520000,154610000) nm → 중심을 빼고 1000000으로 나눕니다.</text><text x="25" y="607" font-size="16">좌표 그림은 비례 축척이 아닙니다. 실제 화면 y 방향은 차트 설정을 확인합니다.</text></g></svg>
