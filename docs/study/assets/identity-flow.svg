<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="title"><title id="title">요청 신원의 우선순위</title><rect width="600" height="640" fill="#fff"/><g fill="#172c40" font-family="system-ui,sans-serif"><text x="300" y="35" text-anchor="middle" font-size="22" font-weight="700">요청 신원의 우선순위</text><rect x="20" y="70" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="100" text-anchor="middle" font-size="20" font-weight="700">/api Bearer token이 인식되는가?</text><text x="300" y="128" text-anchor="middle" font-size="16">유효: 소유자 / 무효: 401 · cookie로 우회하지 않음</text><path d="M300 150v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="180" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="210" text-anchor="middle" font-size="20" font-weight="700">LASTUSER → LAST_USER cookie</text><text x="300" y="238" text-anchor="middle" font-size="16">있으면 infrastructure 신원을 사용</text><path d="M300 260v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="290" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="320" text-anchor="middle" font-size="20" font-weight="700">서명된 자기 입력 세션</text><text x="300" y="348" text-anchor="middle" font-size="16">출처 declared · 관리자 자격 없음</text><path d="M300 370v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="400" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="430" text-anchor="middle" font-size="20" font-weight="700">환경 fallback</text><text x="300" y="458" text-anchor="middle" font-size="16">cloud: anonymous / 그 밖: local-dev</text><path d="M300 480v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="510" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="540" text-anchor="middle" font-size="20" font-weight="700">별도 권한 검사</text><text x="300" y="568" text-anchor="middle" font-size="16">신원 출처 + admin allowlist / X 접두 접근 정책</text></g></svg>