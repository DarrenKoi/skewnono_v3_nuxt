<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="title"><title id="title">반응성 · 요청 캐시 · 영속 상태</title><rect width="600" height="640" fill="#fff"/><g fill="#172c40" font-family="system-ui,sans-serif"><text x="300" y="35" text-anchor="middle" font-size="22" font-weight="700">반응성 · 요청 캐시 · 영속 상태</text><rect x="20" y="70" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="100" text-anchor="middle" font-size="20" font-weight="700">ref / computed / watch</text><text x="300" y="128" text-anchor="middle" font-size="16">값 변경을 화면/파생값/부수효과에 연결</text><path d="M300 150v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="180" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="210" text-anchor="middle" font-size="20" font-weight="700">useState</text><text x="300" y="238" text-anchor="middle" font-size="16">한 Nuxt 앱 안에서 key로 공유 · reload 시 소멸</text><path d="M300 260v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="290" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="320" text-anchor="middle" font-size="20" font-weight="700">useAsyncData + 프로젝트 cache helper</text><text x="300" y="348" text-anchor="middle" font-size="16">같은 key 결과와 요청 Promise 재사용 · TTL 아님</text><path d="M300 370v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="400" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="430" text-anchor="middle" font-size="20" font-weight="700">usePersistedState → localStorage</text><text x="300" y="458" text-anchor="middle" font-size="16">검증한 저장값 복원 · reload 이후 유지</text><path d="M300 480v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="510" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="540" text-anchor="middle" font-size="20" font-weight="700">서버 원본 / SQLite / Redis 등</text><text x="300" y="568" text-anchor="middle" font-size="16">브라우저 설정과 업무 데이터의 권위는 별개</text></g></svg>