<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="title"><title id="title">데이터 provider 선택</title><rect width="600" height="640" fill="#fff"/><g fill="#172c40" font-family="system-ui,sans-serif"><text x="300" y="35" text-anchor="middle" font-size="22" font-weight="700">데이터 provider 선택</text><rect x="20" y="70" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="100" text-anchor="middle" font-size="20" font-weight="700">기능별 명시 override가 있는가?</text><text x="300" y="128" text-anchor="middle" font-size="16">office 요구 + adapter 없음 → 기동 오류</text><path d="M300 150v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="180" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="210" text-anchor="middle" font-size="20" font-weight="700">아니면 전역 mode와 site 판정</text><text x="300" y="238" text-anchor="middle" font-size="16">전역 mock 또는 home/unknown → 기본 mock</text><path d="M300 260v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="290" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="320" text-anchor="middle" font-size="20" font-weight="700">office mode + feature adapter 준비?</text><text x="300" y="348" text-anchor="middle" font-size="16">providers/office.py 있음 → office / 없음 → mock</text><path d="M300 370v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="400" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="430" text-anchor="middle" font-size="20" font-weight="700">route → 안정된 data.py dispatcher</text><text x="300" y="458" text-anchor="middle" font-size="16">응답 contracts.py는 같은 모양</text><path d="M300 480v25m-7-8 7 8 7-8" fill="none" stroke="#255372" stroke-width="3"/><rect x="20" y="510" width="560" height="78" rx="10" fill="#eef5fc" stroke="#255372"/><text x="300" y="540" text-anchor="middle" font-size="20" font-weight="700">health/providers에서 실제 선택 확인</text><text x="300" y="568" text-anchor="middle" font-size="16">사본 freshness와 실제 DB 응답은 추가 확인</text></g></svg>