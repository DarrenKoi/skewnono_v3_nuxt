<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>이상치 컨벤션 · 미리보기 (skewvoir AnalyzePanel)</title>
<style>
  /* Tokens lifted from app/assets/css/main.css (+ the new --sk-warn). */
  :root {
    --sk-canvas: oklch(0.97 0.011 85);
    --sk-surface: #fff;
    --sk-border: oklch(0.90 0.012 80);
    --sk-ink: #15110d;
    --sk-ink-muted: oklch(0.52 0.012 65);
    --sk-ink-subtle: oklch(0.66 0.012 70);
    --sk-normal: #2563eb;
    --sk-warn: oklch(0.70 0.15 75);
    --sk-warn-soft: oklch(0.94 0.06 85);
    --sk-bad: oklch(0.58 0.18 28);
    --sk-bad-soft: oklch(0.94 0.04 30);
    --sk-ink-fill: #15110d;
  }
  .dark {
    --sk-canvas: oklch(0.21 0.008 70);
    --sk-surface: oklch(0.245 0.008 70);
    --sk-border: oklch(0.30 0.008 70);
    --sk-ink: oklch(0.96 0.006 80);
    --sk-ink-muted: oklch(0.74 0.008 70);
    --sk-ink-subtle: oklch(0.56 0.008 70);
    --sk-normal: #5b8cf6;
    --sk-warn: oklch(0.80 0.15 78);
    --sk-bad: oklch(0.72 0.17 28);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px;
    font-family: ui-sans-serif, system-ui, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--sk-canvas); color: var(--sk-ink);
  }
  .wrap { max-width: 1024px; margin: 0 auto; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { font-size: 12px; color: var(--sk-ink-muted); margin: 0 0 18px; }
  .card {
    background: var(--sk-surface); border: 1px solid var(--sk-border);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 14px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .card-title { font-size: 13px; font-weight: 600; }
  .mono { font-family: ui-monospace, "Cascadia Code", monospace; }
  .muted { color: var(--sk-ink-muted); }
  .subtle { color: var(--sk-ink-subtle); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--sk-border); border-radius: 8px; overflow: hidden; }
  .seg button {
    border: 0; background: transparent; color: var(--sk-ink-muted);
    font-size: 11px; padding: 4px 10px; cursor: pointer;
  }
  .seg button.on { background: var(--sk-ink-fill); color: #fff; }
  .dark .seg button.on { background: var(--sk-ink); color: var(--sk-canvas); }
  label.num { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--sk-ink-muted); }
  label.num input {
    width: 52px; font-size: 11px; padding: 3px 5px; text-align: right;
    border: 1px solid var(--sk-border); border-radius: 6px; background: var(--sk-surface); color: var(--sk-ink);
  }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 10.5px; color: var(--sk-ink-muted); align-items: center; }
  .legend .item { display: inline-flex; align-items: center; gap: 5px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
  .dot.normal { background: var(--sk-normal); }
  .dot.watch { background: var(--sk-warn); }
  .dot.abnormal { background: var(--sk-bad); }
  .dot.insufficient { background: var(--sk-ink-subtle); }
  svg { width: 100%; height: 320px; display: block; }
  .grid { stroke: var(--sk-border); stroke-width: 1; }
  .axis { fill: var(--sk-ink-subtle); font-size: 10px; }
  .band { fill: var(--sk-normal); opacity: 0.10; }
  .meanline { fill: none; stroke: var(--sk-normal); stroke-width: 2; }
  circle.pt { cursor: pointer; }
  circle.normal { fill: var(--sk-normal); }
  circle.watch { fill: var(--sk-warn); }
  circle.abnormal { fill: var(--sk-bad); }
  circle.insufficient { fill: var(--sk-ink-subtle); }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; }
  .badge .lab.watch { color: var(--sk-warn); }
  .badge .lab.abnormal { color: var(--sk-bad); }
  .badge .lab.insufficient { color: var(--sk-ink-subtle); }
  #tip {
    position: fixed; pointer-events: none; z-index: 9; max-width: 320px;
    background: var(--sk-surface); border: 1px solid var(--sk-border); border-radius: 8px;
    padding: 7px 9px; font-size: 11px; line-height: 1.5; box-shadow: 0 6px 22px rgba(0,0,0,.16);
    opacity: 0; transition: opacity .08s;
  }
  #tip .warn { color: var(--sk-warn); }
  #tip .bad { color: var(--sk-bad); }
  #tip .sub { color: var(--sk-ink-subtle); }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; }
  .detail-row { display: flex; gap: 10px; align-items: center; }
  select { font-size: 11px; padding: 3px 6px; border: 1px solid var(--sk-border); border-radius: 6px; background: var(--sk-surface); color: var(--sk-ink); }
  .note { font-size: 11px; color: var(--sk-ink-subtle); margin-top: 6px; }
  .ghost-btn { font-size: 11px; padding: 4px 10px; border: 1px solid var(--sk-border); border-radius: 8px; background: transparent; color: var(--sk-ink-muted); cursor: pointer; }
  .ghost-btn.on { border-color: var(--sk-warn); color: var(--sk-warn); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>이상치(abnormality) 컨벤션 · 미리보기</h1>
      <p class="sub">skewvoir AnalyzePanel · 시계열 추이 — range/stddev 방식을 실제 LOO 로직으로 계산해 렌더합니다.</p>
    </div>
    <button class="ghost-btn" id="darkBtn">🌙 dark</button>
  </div>

  <!-- ── 시계열 추이 카드 ───────────────────────────────────────── -->
  <div class="card">
    <div class="card-head">
      <div class="card-title">시계열 추이 · CD_MEAN</div>
      <div class="mono" id="summary" style="font-size:10.5px;color:var(--sk-ink-muted)"></div>
    </div>

    <div class="controls">
      <div class="seg" id="methodSeg">
        <button data-m="range" class="on">범위(%)</button>
        <button data-m="stddev">표준편차(σ) · 진단</button>
      </div>
      <span id="rangeCtl">
        <label class="num">주의 ±<input id="watchPct" type="number" value="10" step="1" min="1">%</label>
        <label class="num">이상 ±<input id="abnPct" type="number" value="20" step="1" min="1">%</label>
      </span>
      <span id="stdCtl" style="display:none">
        <label class="num">주의 ±<input id="watchK" type="number" value="2" step="0.5" min="0.5">σ</label>
        <label class="num">이상 ±<input id="abnK" type="number" value="3" step="0.5" min="0.5">σ</label>
      </span>
      <button class="ghost-btn" id="fewBtn" title="N&lt;5 시뮬레이션">표본부족(N&lt;5) 보기</button>
      <span class="legend" id="legend" style="margin-left:auto"></span>
    </div>

    <svg id="chart" viewBox="0 0 820 320" preserveAspectRatio="none"></svg>
    <p class="note">점에 마우스를 올리면 한국어 사유가 표시됩니다. (정상 = 무채색, 주의 = amber, 이상 = red, 미평가 = grey)</p>
  </div>

  <!-- ── 단일 MSR 상세 카드 (SkAnomalyBadge demo) ───────────────── -->
  <div class="card">
    <div class="card-head">
      <div class="detail-row">
        <div class="card-title">단일 MSR 상세</div>
        <span id="focusBadge"></span>
      </div>
      <select id="focusSel"></select>
    </div>
    <div class="mono subtle" id="focusReason" style="font-size:11px;min-height:18px"></div>
  </div>
</div>

<div id="tip"></div>

<script>
// ── mock 선택 데이터 (one mean point per MSR, 시간순) ──────────────
const DATA = [
  { label: '06-12 08:10', eqp: 'EQP-01', mean: 10.1, min: 9.3, max: 10.9, std: 0.40 },
  { label: '06-12 09:05', eqp: 'EQP-02', mean: 9.9,  min: 9.1, max: 10.7, std: 0.42 },
  { label: '06-12 10:20', eqp: 'EQP-01', mean: 10.0, min: 9.2, max: 10.8, std: 0.38 },
  { label: '06-12 11:35', eqp: 'EQP-03', mean: 10.2, min: 9.4, max: 11.0, std: 0.41 },
  { label: '06-12 13:00', eqp: 'EQP-02', mean: 9.8,  min: 9.0, max: 10.6, std: 0.39 },
  { label: '06-12 14:15', eqp: 'EQP-01', mean: 11.3, min: 10.3, max: 12.4, std: 0.45 },
  { label: '06-12 15:30', eqp: 'EQP-03', mean: 10.0, min: 9.2, max: 10.8, std: 0.40 },
  { label: '06-12 16:45', eqp: 'EQP-02', mean: 9.9,  min: 8.4, max: 11.6, std: 0.90 },
  { label: '06-12 18:00', eqp: 'EQP-01', mean: 12.4, min: 11.5, max: 13.3, std: 0.37 },
  { label: '06-12 19:10', eqp: 'EQP-03', mean: 10.1, min: 9.3, max: 10.9, std: 0.41 },
  { label: '06-12 20:25', eqp: 'EQP-02', mean: 9.7,  min: 8.9, max: 10.5, std: 0.43 },
  { label: '06-12 21:40', eqp: 'EQP-01', mean: 10.0, min: 9.2, max: 10.8, std: 0.39 },
];

// ── 검출 로직 (plan과 동일: LOO + range/stddev) ──────────────────
const round = (n, d=2) => Number(n.toFixed(d));
const sgn = n => n >= 0 ? '+' : '';
const PEER_MIN_N = { range: 3, stddev: 5 };

function looStats(values, skip) {
  const o = [];
  for (let i = 0; i < values.length; i++) if (i !== skip && Number.isFinite(values[i])) o.push(values[i]);
  if (o.length < 1) return null;
  const mean = o.reduce((s,v)=>s+v,0)/o.length;
  const std = o.length > 1 ? Math.sqrt(o.reduce((s,v)=>s+(v-mean)**2,0)/(o.length-1)) : 0;
  return { mean, std };
}
function bandRange(a, c){ return a < c.watchPct ? 'normal' : a < c.abnormalPct ? 'watch' : 'abnormal'; }
function bandStd(a, c){ return a < c.watchK ? 'normal' : a < c.abnormalK ? 'watch' : 'abnormal'; }

function scoreRange(value, center, c, tag='') {
  if (!Number.isFinite(value) || !Number.isFinite(center) || Math.abs(center) < 1e-6)
    return { status:'insufficient', severity:'normal', score:NaN, reason:'표본 부족 — 미평가' };
  const dev = (value - center) / Math.abs(center) * 100;
  const sev = bandRange(Math.abs(dev), c);
  const pre = tag ? tag+' ' : '';
  return { status:'evaluated', severity:sev, score:dev,
    reason:`${pre}나머지 평균 ${round(center)} 대비 ${sgn(dev)}${round(dev,1)}% (실측 ${round(value)}) · 허용 ±${c.watchPct}%${sev==='normal'?'':' 초과'}` };
}
function scoreStd(value, mean, std, c, tag='') {
  if (![value,mean,std].every(Number.isFinite))
    return { status:'insufficient', severity:'normal', score:NaN, reason:'표본 부족 — 미평가' };
  const pre = tag ? tag+' ' : '';
  if (std === 0) {
    if (value === mean) return { status:'evaluated', severity:'normal', score:0, reason:`${pre}나머지 동일값, 편차 없음` };
    const d = value - mean;
    return { status:'evaluated', severity:'abnormal', score:d, reason:`${pre}표준편차 0 기준에서 이탈, Δ ${sgn(d)}${round(d)}` };
  }
  const k = (value - mean) / std;
  const sev = bandStd(Math.abs(k), c);
  return { status:'evaluated', severity:sev, score:k,
    reason:`${pre}나머지 평균 ${round(mean)}, 표준편차 ${round(std)} · ${sgn(k)}${round(k)}σ (실측 ${round(value)})${sev==='normal'?'':` · ±${c.abnormalK}σ 초과`}` };
}
function peerVerdicts(values, cfg, metric, tag='') {
  const minN = PEER_MIN_N[cfg.method];
  const ins = () => ({ status:'insufficient', severity:'normal', score:NaN, reason:'표본 부족 — 미평가', metric });
  if (values.filter(Number.isFinite).length < minN) return values.map(ins);
  return values.map((v, i) => {
    if (!Number.isFinite(v)) return ins();
    const s = looStats(values, i);
    if (!s) return ins();
    const part = cfg.method === 'range'
      ? scoreRange(v, s.mean, cfg.range, tag)
      : scoreStd(v, s.mean, s.std, cfg.stddev, tag);
    return { ...part, metric };
  });
}
const RANK = { normal:0, watch:1, abnormal:2 };
function combine(verdicts) {
  const sorted = [...verdicts].sort((a,b)=>{
    if (a.status !== b.status) return a.status==='evaluated' ? -1 : 1;
    const dr = RANK[b.severity]-RANK[a.severity]; if (dr) return dr;
    const sa = Number.isFinite(a.score)?Math.abs(a.score):-1, sb = Number.isFinite(b.score)?Math.abs(b.score):-1;
    return sb-sa;
  });
  const ev = verdicts.filter(v=>v.status==='evaluated');
  if (!ev.length) return { status:'insufficient', severity:'normal', verdicts:sorted };
  const sev = ev.reduce((w,v)=>RANK[v.severity]>RANK[w]?v.severity:w, 'normal');
  return { status:'evaluated', severity:sev, verdicts:sorted };
}

// ── 상태 ────────────────────────────────────────────────────────
const cfg = { method:'range', range:{ watchPct:10, abnormalPct:20, minAbsCenter:1e-6 }, stddev:{ watchK:2, abnormalK:3 } };
let fewMode = false;
let focusIdx = 8;

function sevKey(c){ return !c ? 'normal' : c.status==='insufficient' ? 'insufficient' : c.severity; }

function compute() {
  const data = fewMode ? DATA.slice(0, 3) : DATA;
  const meanV = peerVerdicts(data.map(d=>d.mean), cfg, 'mean');
  const spreadV = peerVerdicts(data.map(d=>d.std), cfg, 'spread', '산포');
  return data.map((d,i)=>({ ...d, verdict: combine([meanV[i], spreadV[i]]) }));
}

// ── 렌더 ────────────────────────────────────────────────────────
const W=820, H=320, padL=44, padR=18, padT=18, padB=58;
function render() {
  const pts = compute();
  const svg = document.getElementById('chart');
  const means = pts.map(p=>p.mean), mins = pts.map(p=>p.min), maxs = pts.map(p=>p.max);
  const lo = Math.min(...mins), hi = Math.max(...maxs); const pad = (hi-lo)*0.08 || 1;
  const yMin = lo-pad, yMax = hi+pad;
  const n = pts.length;
  const X = i => padL + (n===1?0:i*(W-padL-padR)/(n-1));
  const Y = v => padT + (1-(v-yMin)/(yMax-yMin))*(H-padT-padB);

  let s = '';
  // gridlines + y labels
  for (let g=0; g<=4; g++){
    const v = yMin + g*(yMax-yMin)/4, y = Y(v);
    s += `<line class="grid" x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}"/>`;
    s += `<text class="axis" x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text>`;
  }
  // min/max band
  const up = pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.max).toFixed(1)}`);
  const dn = pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.min).toFixed(1)}`).reverse();
  s += `<polygon class="band" points="${up.concat(dn).join(' ')}"/>`;
  // mean line
  s += `<polyline class="meanline" points="${pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.mean).toFixed(1)}`).join(' ')}"/>`;
  // x labels
  pts.forEach((p,i)=>{ s += `<text class="axis" x="${X(i).toFixed(1)}" y="${H-padB+22}" text-anchor="middle" transform="rotate(32 ${X(i).toFixed(1)} ${H-padB+22})">${p.label}</text>`; });
  // points
  pts.forEach((p,i)=>{
    const k = sevKey(p.verdict);
    const r = k==='abnormal'?6.5 : k==='watch'?6 : k==='insufficient'?5 : 4.5;
    s += `<circle class="pt ${k}" data-i="${i}" cx="${X(i).toFixed(1)}" cy="${Y(p.mean).toFixed(1)}" r="${r}"/>`;
  });
  svg.innerHTML = s;

  // hover tips
  const tip = document.getElementById('tip');
  svg.querySelectorAll('circle.pt').forEach(c=>{
    c.addEventListener('mousemove', e=>{
      const p = pts[+c.dataset.i], v = p.verdict;
      let html = `<b>${p.label}</b> · ${p.eqp}<br>mean <b>${p.mean}</b> · min/max ${p.min}/${p.max} · std ${p.std}`;
      if (v.status==='insufficient') html += `<br><span class="sub">⚠ 표본 부족 — 미평가</span>`;
      else if (v.severity!=='normal') {
        const cls = v.severity==='abnormal'?'bad':'warn';
        v.verdicts.forEach(x=>{ if(!(x.status==='evaluated'&&x.severity==='normal')) html += `<br><span class="${cls}">⚠ ${x.reason}</span>`; });
      } else html += `<br><span class="sub">정상 (허용 범위 내)</span>`;
      tip.innerHTML = html; tip.style.opacity = 1;
      tip.style.left = Math.min(e.clientX+14, window.innerWidth-330)+'px';
      tip.style.top = (e.clientY+14)+'px';
    });
    c.addEventListener('mouseleave', ()=>{ tip.style.opacity = 0; });
  });

  // summary
  let w=0,a=0; pts.forEach(p=>{ if(p.verdict.severity==='abnormal')a++; else if(p.verdict.severity==='watch')w++; });
  document.getElementById('summary').textContent = `주의 ${w} · 이상 ${a} / ${n} MSR`;

  // legend
  const L = cfg.method==='range'
    ? { w:`±${cfg.range.watchPct}%`, a:`±${cfg.range.abnormalPct}% 초과`, m:'범위' }
    : { w:`±${cfg.stddev.watchK}σ`, a:`±${cfg.stddev.abnormalK}σ 초과`, m:'표준편차 · 진단' };
  document.getElementById('legend').innerHTML =
    `<span class="item"><span class="dot watch"></span>주의 ${L.w}</span>`+
    `<span class="item"><span class="dot abnormal"></span>이상 ${L.a}</span>`+
    `<span class="item"><span class="dot insufficient"></span>미평가</span>`+
    `<span class="subtle">· 사용자 허용범위 (${L.m})</span>`;

  // focus badge + selector
  const sel = document.getElementById('focusSel');
  if (sel.options.length !== n) {
    sel.innerHTML = pts.map((p,i)=>`<option value="${i}">${p.label} · ${p.eqp}</option>`).join('');
  }
  if (focusIdx >= n) focusIdx = 0;
  sel.value = focusIdx;
  const fv = pts[focusIdx].verdict, fk = sevKey(fv);
  const badge = document.getElementById('focusBadge');
  if (fk === 'normal') { badge.innerHTML = ''; }
  else {
    const lab = fk==='insufficient'?'미평가':fk==='abnormal'?'이상':'주의';
    badge.innerHTML = `<span class="badge"><span class="dot ${fk}"></span><span class="lab ${fk}">${lab}</span></span>`;
  }
  document.getElementById('focusReason').innerHTML = fv.status==='insufficient'
    ? '표본 부족 — 미평가'
    : (fv.verdicts.filter(x=>!(x.status==='evaluated'&&x.severity==='normal')).map(x=>x.reason).join('  ·  ') || '정상 (허용 범위 내)');
}

// ── 이벤트 ──────────────────────────────────────────────────────
document.getElementById('methodSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  cfg.method = b.dataset.m;
  document.querySelectorAll('#methodSeg button').forEach(x=>x.classList.toggle('on', x===b));
  document.getElementById('rangeCtl').style.display = cfg.method==='range'?'':'none';
  document.getElementById('stdCtl').style.display = cfg.method==='stddev'?'':'none';
  render();
});
const bind = (id, set) => document.getElementById(id).addEventListener('input', e=>{ set(parseFloat(e.target.value)); render(); });
bind('watchPct', v=>cfg.range.watchPct=v);
bind('abnPct',   v=>cfg.range.abnormalPct=v);
bind('watchK',   v=>cfg.stddev.watchK=v);
bind('abnK',     v=>cfg.stddev.abnormalK=v);
document.getElementById('fewBtn').addEventListener('click', e=>{ fewMode=!fewMode; e.target.classList.toggle('on', fewMode); render(); });
document.getElementById('focusSel').addEventListener('change', e=>{ focusIdx=+e.target.value; render(); });
document.getElementById('darkBtn').addEventListener('click', ()=>document.documentElement.classList.toggle('dark'));

render();
</script>
</body>
</html>
