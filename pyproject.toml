# Root pytest + ruff configuration.
#
# `[tool.*]` tables ONLY. SKEWNONO is not an installable package — Flask runs
# from the repo root via index.py (Phase 3 copies the tree to
# /project/workSpace/), and npm builds the Nuxt SPA separately. A `[project]`
# or `[build-system]` table here would make pip/uv/hatch treat the repo as a
# distribution and try to build it; a tool table carries no such effect.
#
# The backend run documented in openwiki/ and docs/ is:
#
#   .venv/bin/python -m pytest tests back_dev_home -q
#
# `testpaths` below makes a bare `.venv/bin/python -m pytest -q` collect that
# exact set, so the two forms are interchangeable.

[tool.pytest.ini_options]

# The two Python test roots: the root Flask/integration tests, plus the
# per-feature provider contract suites colocated under `back_dev_home/**/tests/`.
# Nothing else in the tree holds Python tests — front-dev-home/ runs node:test,
# and scripts/ has none — so this pins the documented invocation rather than
# widening it.
#
# Not set: `norecursedirs`. pytest's default already excludes `node_modules` and,
# via `.*`, `.venv/` (which carries ~1300 third-party `test_*.py` files).
# Inheriting that default beats copying it here, where the copy would silently
# suppress any entry a future pytest adds. `testpaths` is the real guard for the
# bare run anyway — it never walks either directory in the first place.
testpaths = ["tests", "back_dev_home"]

# --- import mode: load-bearing, please do not "clean this up" ---------------
# Nothing in this repo is pip-installed, yet tests import its top-level packages
# by absolute path — `back_dev_home.*` and `tests._office_state`, but also
# `scripts`, `ops_store` and `ftp_handler`. That resolves only because the repo
# root ends up on `sys.path`, which two independent mechanisms arrange:
#
#   1. `python -m pytest` — the form used throughout docs/ and openwiki/ — puts
#      the CWD on `sys.path` as a plain side effect of `-m`.
#   2. `prepend` import mode walks up from a test module past every consecutive
#      `__init__.py` (`tests/__init__.py`, plus one in each `back_dev_home/**/
#      tests/` dir) to find the package root, then inserts THAT directory at
#      `sys.path[0]` — again the repo root.
#
# Only (2) covers the bare `pytest` console script, which is what IDE test
# runners and `uv run pytest` invoke. Measured on this tree, switching the
# console script to `--import-mode=importlib` drops 81 tests and adds 7
# collection errors: `No module named 'ops_store'` (x4), `'scripts'` (x2),
# `'ftp_handler'` (x1). Note that `back_dev_home.*` keeps importing fine there —
# loading `back_dev_home/conftest.py` registers that package as a side effect —
# so a spot check makes `importlib` look harmless when it is not.
#
# `prepend` is pinned not because it is today's default, but because a future
# pytest changing that default would break the console script while
# `python -m pytest` kept passing. Deleting `tests/__init__.py` costs the same
# `sys.path` insertion; deleting one of the nested `back_dev_home/**/tests/
# __init__.py` files instead collides test basenames (many of those dirs share a
# `test_contract.py`). Neither is a cleanup.
addopts = ["--import-mode=prepend"]

# No `markers` key on purpose: the only marker used anywhere in the suite is the
# builtin `@pytest.mark.parametrize`. Likewise no `-q`, no `--strict-*` and no
# coverage in `addopts`, so ad-hoc and CI runs behave exactly as they did before
# this file existed. `back_dev_home/conftest.py` — which loads
# `back_dev_home/.env` so office-mode gates (`SKEWNONO_<FEATURE>_PROVIDER=office`)
# see the same connection vars as app startup — is still discovered the usual
# way; it is not registered here.


# --- ruff: the Python static gate ------------------------------------------
# The backend had no static checking at all — pytest was the only Python gate,
# so a symbol renamed in one place and not another was caught only on a covered
# path. ruff runs the whole tree in ~0.02s, which is what makes it worth wiring
# into CI next to pytest.
#
# Scope is deliberately narrow: pyflakes `F` + the core `E4`/`E7`/`E9`
# pycodestyle subset + flake8-bugbear `B`. No formatter — a `ruff format` pass
# would rewrite all ~350 files in one commit and bury `git blame` for no
# correctness gain. No import sorting (`I`) for the same reason.
#
# The list is written out with `select` rather than inherited as "ruff's defaults
# plus B", because ruff's DEFAULTS ARE NOT STABLE ACROSS RELEASES: 0.15 defaulted
# to `E4,E7,E9,F`, and 0.16 widened that to include I, UP, RUF, BLE, DTZ, S, PL
# and FURB — 444 findings on this tree, i.e. an instantly red CI on an unrelated
# PR. An explicit `select` makes the gate mean the same thing on every ruff
# version, so upgrading ruff brings speed and bug fixes but never a surprise
# rule. Widening the gate should be a deliberate commit that also fixes whatever
# the new rules find.

[tool.ruff]
# The LOWEST Python this code must run on, which is the office's 3.11 — not the
# 3.14 the home .venv uses. Targeting 3.14 here would tell ruff that 3.12+
# syntax and stdlib APIs are fair game, so office-breaking code would lint clean
# at home and fail only after it is conveyed. Raise this only when the office
# interpreter moves.
target-version = "py311"

# Scope is the code this repo DEVELOPS, so a bare `ruff check .` equals the CI
# gate. The excluded trees are real code that must keep working, just not code a
# lint failure here should block:
#
#   ops_store, ftp_handler — vendored copies of the shared 사내 flask_modules
#   (confirmed 2026-07-26). back_dev_home imports them (6 and 1 call sites), but
#   a fix applied only here would silently drift from the upstream copy, so the
#   rule is "change both or neither" — which a CI gate cannot enforce. These
#   hold 1 and 7 findings respectively.
#
#   minio_handler (7 call sites), ops_index_mgmt (0) — excluded on the same
#   presumption, NOT independently confirmed. Both currently lint clean, so the
#   exclusion costs nothing either way; if one is actually owned code, gating it
#   is a no-op today and the right move is to delete it from this list.
#
# (afm_data_platform was also excluded, carrying 42 findings. The folder was
# removed in 2026-07 once its features had been absorbed into back_dev_home/afm
# and front-dev-home; its two 사내 spec docs live on in docs/afm/.)
#
# Dropping the vendored exclusions means adopting 8 findings in code the backend
# gate has no business failing on. Re-scope deliberately, not by widening this
# list.
exclude = [
    "ops_store",
    "ftp_handler",
    "minio_handler",
    "ops_index_mgmt",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

# Two intentional conventions that ruff's defaults read as mistakes. Both are
# suppressions of a house style, not of a finding:
#
#   F401 in `__init__.py` — a feature package re-exports its blueprint
#   (`from .routes import bp`) so `back_dev_home/__init__.py`'s auto-discovery
#   can find it. The import IS the point; it is never referenced locally.
#
#   E402 in tests — several suites arrange `sys.path` or set
#   `SKEWNONO_*_PROVIDER` before importing the module under test, so the
#   import genuinely cannot sit at the top of the file.
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/tests/*.py" = ["E402"]
"tests/*.py" = ["E402"]
